<!DOCTYPE html>
<html>
    <head>
        <title>Expense Tracker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Expense Tracker</h1>
        <h2 id="total">Total spent: 0 UAH</h2>
        <h2>Your expenses</h2>
        <div id="expenses_list"></div>
        <p>Track your spendings in one place</p>
        <div class="expense_form">
            <label for="amount">Amount:</label>
            <input id="amount" type="number" placeholder="Enter amount">
            <label for="category">Category:</label>
            <input id="category" type="text" placeholder="Enter category:">
            <button id="add_expense">Add expense</button>
        </div>
        <script src="script.js"></script>
    </body>
</html>
